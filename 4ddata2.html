
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f7f8fc 0%, #eef2ff 100%);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .card {
            background: #ffffff;
            width: 90%;
            max-width: 480px;
            padding: 48px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
        }
        /* Loading spinner animation */
        .loader {
            width: 56px;
            height: 56px;
            border: 4px solid #e6edff;
            border-top-color: #3671e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            to {transform: rotate(360deg);}
        }
        h2 {
            font-size: 24px;
            color: #1d2939;
            margin-bottom: 12px;
        }
        .desc {
            font-size: 15px;
            color: #667085;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .error-text {
            font-size: 18px;
            color: #d92d20;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            padding: 14px 36px;
            background-color: #3671e9;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.25s ease;
        }
        .btn-link:hover {
            background-color: #2859c4;
        }
        .tip-small {
            margin-top: 16px;
            font-size: 13px;
            color: #98a2b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader" id="loadingIcon"></div>
        <h2>Redirecting to Registration</h2>
        <p class="desc">The system is selecting the best route for you. Please wait a moment…</p>
        <p class="error-text" id="errorMsg"></p>
        <a href="" class="btn-link" id="manualLink" style="display:none;">Click Here to Continue</a>
        <p class="tip-small">If the page does not respond, please click the button above</p>
    </div>

<script>
// ====================== [Configuration: add your domains here] ======================
const DOMAIN_LIST = [
"https://www.4dpredict.shop",
"https://4dpredict.shop",
"https://www.myluck4d.shop",
"https://myluck4d.shop",

    // Add more domains in the format "https://xxx.com",
];
const DEFAULT_INVITE = "";
// =================================================================

function getRandomDomain(){
    const randomIndex = Math.floor(Math.random() * DOMAIN_LIST.length);
    return DOMAIN_LIST[randomIndex];
}

(function(){
    const queryRaw = window.location.search.slice(1);
    let inviteCode = DEFAULT_INVITE;

    if(queryRaw){
        const realParamStr = queryRaw.split("?").pop();
        const innerParams = new URLSearchParams(realParamStr);
        inviteCode = innerParams.get('invite') || DEFAULT_INVITE;
    }

    const errorDom = document.getElementById("errorMsg");
    const linkDom = document.getElementById('manualLink');
    const loadingIcon = document.getElementById('loadingIcon');

    if(!inviteCode){
        errorDom.innerText = "No valid invite code detected";
        loadingIcon.style.display = "none";
        return;
    }

    const randomDomain = getRandomDomain();
    const targetUrl = `${randomDomain}/register.php?invite=${inviteCode}`;

    linkDom.href = targetUrl;
    linkDom.style.display = "inline-block";

    // Native page redirect
    window.location.href = targetUrl;
})();
</script>
</body>
</html>
